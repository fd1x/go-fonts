---

# Managed by fd1x/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.

name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/copilot-instructions.md'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - '.gitattributes'
      - '.gitignore'
      - '.markdownlint.yml'
      - '.terraform-docs.yml'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'SECURITY.md'
  pull_request:
    branches: [main]
  # A run that fails at workflow load has no jobs and cannot be re-run, so
  # without this the only way to retry after such a failure is a new push.
  workflow_dispatch:
  # Nightly on main: the one run that saves a cache. Every other run only
  # restores, so a pull request can never write what main later reads.
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  test:
    name: test
    uses: fd1x/.github/.github/workflows/go-test.yml@a20f2296bcfc62f6da16655cfbdd409e1b36cdc9  # v20261011-2
    secrets:
      REPO_ACCESS_APP_CLIENT_ID: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
      REPO_ACCESS_APP_PRIVATE_KEY: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
