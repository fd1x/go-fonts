---

# Managed by fd1x/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.

name: Tag

on:
  push:
    branches: ['main']
    # Without this every prose fix mints a version and a Dependabot pull request
    # for every consumer. `**.md` not `**/*.md`: the latter misses a root README.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/**'
      - '.gitattributes'
      - '.gitignore'

# contents: write, not read. A reusable's permissions are intersected with the
# caller's, so `read` here makes `gh release create` 403 on the first merge.
permissions:
  contents: write

# One tag job at a time per repo: concurrent merges would compute the same next
# version. Queued, not cancelled — the second merge still needs its own tag.
concurrency:
  group: go-module-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    uses: fd1x/.github/.github/workflows/go-module-tag.yml@efb79cd1186673663e1282fa9cb656aac9b663df  # v20261015-1
